<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kavenga: Songs of the Star Path</title>
  <link rel="icon" href="./favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32.png" />

  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="./styles.css?v=20261118w" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js",
        "./src/core/gameConstants.js": "./src/core/gameConstants.js?v=20261117g",
        "./src/core/gameState.js": "./src/core/gameState.js?v=20261117g",
        "./src/core/campaignManager.js": "./src/core/campaignManager.js?v=20261118g",
        "./src/core/objectivesManager.js": "./src/core/objectivesManager.js?v=20261117g",
        "./src/core/achievementsManager.js": "./src/core/achievementsManager.js?v=20261117s",
        "./src/data/objectivesData.js": "./src/data/objectivesData.js?v=20261117g",
        "./src/data/achievementsData.js": "./src/data/achievementsData.js?v=20261117g",
        "./src/data/constellationLessonsData.js": "./src/data/constellationLessonsData.js?v=20261117g",
        "./src/data/constellationSilhouettesData.js": "./src/data/constellationSilhouettesData.js?v=20261117g",
        "./src/data/skyVigilData.js": "./src/data/skyVigilData.js?v=20261117g",
        "./src/data/walkableIslandsData.js": "./src/data/walkableIslandsData.js?v=20261118a",
        "./src/simulation/oceanSim.js": "./src/simulation/oceanSim.js?v=20261117g",
        "./src/rendering/CameraController.js": "./src/rendering/CameraController.js?v=20261117g",
        "./src/rendering/CloudSculptBuilder.js": "./src/rendering/CloudSculptBuilder.js?v=20261117g",
        "./src/rendering/IslandTerrainBuilder.js": "./src/rendering/IslandTerrainBuilder.js?v=20261117t",
        "./src/rendering/PlayerCharacterBuilder.js": "./src/rendering/PlayerCharacterBuilder.js?v=20261117h",
        "./src/rendering/ShoreDioramaRenderer.js": "./src/rendering/ShoreDioramaRenderer.js?v=20261118e",
        "./src/rendering/SkyDomeRenderer.js": "./src/rendering/SkyDomeRenderer.js?v=20261117g",
        "./src/rendering/WalkableIslandScene.js": "./src/rendering/WalkableIslandScene.js?v=20261118a",
        "./src/rendering/WorldCuesRenderer.js": "./src/rendering/WorldCuesRenderer.js?v=20261117g",
        "./src/audio/BackgroundMusicEngine.js": "./src/audio/BackgroundMusicEngine.js?v=20261118b",
        "./src/audio/ChantAndDrumEngine.js": "./src/audio/ChantAndDrumEngine.js?v=20261118a",
        "./src/ui/AchievementsUI.js": "./src/ui/AchievementsUI.js?v=20261117l",
        "./src/ui/CrewSplashUI.js": "./src/ui/CrewSplashUI.js?v=20261118g",
        "./src/ui/ElderVigilPromptUI.js": "./src/ui/ElderVigilPromptUI.js?v=20261117g",
        "./src/ui/IslandHubUI.js": "./src/ui/IslandHubUI.js?v=20261118s",
        "./src/ui/SailingHUD.js": "./src/ui/SailingHUD.js?v=20261118c",
        "./src/ui/SkyVigilUI.js": "./src/ui/SkyVigilUI.js?v=20261117r",
        "./src/ui/WalkableIslandUI.js": "./src/ui/WalkableIslandUI.js?v=20261118s",
        "./src/ui/IslandSettingsUI.js": "./src/ui/IslandSettingsUI.js?v=20261117s"
      }
    }
  </script>
</head>
<body>
  <!-- Full-bleed WebGL 3D Sky Dome, Ocean Swells & Twin-Hulled Vaka -->
  <div id="webgl-container"></div>

  <!-- Projected Sky Star Labels (strictly mode-gated; hidden in Master Navigator) -->
  <div id="sky-labels-layer"></div>

  <!-- Zero-Compass Open-Ocean Sailing HUD -->
  <div id="sailing-hud" class="hidden"></div>

  <!-- Grounded On-Shore Star-Stone Vigil (Ahu Feti'a) Sky Observatory -->
  <div id="sky-vigil-ui" class="hidden"></div>

  <!-- Optional 3D Walk Shore HUD & Proximity POI Popups -->
  <div id="walkable-island-ui" class="hidden"></div>

  <!-- Unified 3D Shore Diorama & 4-Station Docked Panel -->
  <div id="island-hub"></div>

  <!-- Shared Ashore Top-Right Icon Controls (outside Hub & Walk UI) -->
  <div id="shore-top-controls" class="shore-top-controls hidden" aria-label="Shore Controls">
    <button
      class="island-settings-btn shore-icon-btn hub-walk-opt-btn hidden"
      id="btnShoreWalkToggle"
      type="button"
      title="Walk Shore in 3rd-person (Arrow Keys / WASD)"
      aria-label="Walk Shore"
    >
      <span id="shoreWalkGlyph" aria-hidden="true">🚶</span>
    </button>
    <button
      class="island-settings-btn shore-icon-btn"
      id="btnShoreToggleSound"
      type="button"
      title="Sound On — Click to Mute"
      aria-label="Toggle Sound"
    >
      <span id="shoreSoundGlyph" aria-hidden="true">🔊</span>
    </button>
    <button
      class="island-settings-btn shore-icon-btn island-achievements-btn"
      id="btnShoreOpenAchievements"
      type="button"
      title="View Wayfinder Achievements"
      aria-label="Achievements"
    >
      <span aria-hidden="true">🏆</span>
    </button>
    <button
      class="island-settings-btn shore-icon-btn"
      id="btnShoreOpenSettings"
      type="button"
      title="Open Island Settings"
      aria-label="Settings"
    >
      <span class="island-settings-gear" aria-hidden="true">⚙</span>
    </button>
  </div>

  <!-- First-Time Shore Onboarding Tour -->
  <div id="onboarding-tour-ui" class="hidden"></div>

  <!-- Ashore Settings Modal & Start-Over Confirmation (Island Phase Only) -->
  <div id="island-settings-ui" class="hidden"></div>

  <!-- Pre-Departure Elder Night-Sky Teaching Choice Popup -->
  <div id="elder-vigil-prompt-ui" class="hidden"></div>

  <!-- Crew Recruitment Splash Modal -->
  <div id="crew-splash-ui" class="hidden"></div>

  <!-- Global Celebration Banners (Sea & Shore) + Ashore Achievements Gallery Modal -->
  <div id="achievements-ui"></div>

  <script type="module" src="./src/main.js?v=20261118x"></script>
</body>
</html>
