<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kavenga — Known Ocean Map</title>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js"
      }
    }
  </script>
  <style>
    :root {
      --bg-deep: #071320;
      --panel-bg: rgba(11, 21, 34, 0.92);
      --panel-solid: rgba(9, 17, 28, 0.98);
      --panel-border: rgba(230, 184, 114, 0.26);
      --accent-gold: #e6b872;
      --accent-teal: #42d9c8;
      --accent-coral: #f08c6b;
      --text-main: #f2ece1;
      --text-muted: #9db0c4;
      --item-hover: rgba(230, 184, 114, 0.12);
      --item-active: rgba(66, 217, 200, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-deep);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    .map-layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      width: 100%;
      height: 100%;
      transition: grid-template-columns 0.18s ease;
    }

    .map-layout.sidebar-collapsed {
      grid-template-columns: 0px 1fr;
    }

    /* Left Sidebar */
    .sidebar {
      background: var(--panel-solid);
      border-right: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      z-index: 20;
      min-width: 0;
    }

    .map-layout.sidebar-collapsed .sidebar {
      border-right: none;
    }

    .sidebar-header {
      padding: 14px 15px 11px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .sidebar-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .sidebar-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: var(--accent-gold);
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
    }

    .nav-link {
      font-size: 11.5px;
      color: var(--accent-teal);
      text-decoration: none;
      padding: 3px 7px;
      border-radius: 6px;
      border: 1px solid rgba(66, 217, 200, 0.32);
      background: rgba(66, 217, 200, 0.08);
      white-space: nowrap;
    }

    .nav-link:hover {
      background: rgba(66, 217, 200, 0.2);
    }

    .region-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .region-pill {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: var(--text-main);
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease;
    }

    .region-pill:hover {
      background: rgba(230, 184, 114, 0.16);
      border-color: rgba(230, 184, 114, 0.45);
    }

    .region-pill.active {
      background: rgba(230, 184, 114, 0.24);
      border-color: var(--accent-gold);
      color: #fff6e5;
    }

    .search-input {
      width: 100%;
      padding: 7px 10px;
      border-radius: 7px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      font-size: 12.5px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent-gold);
    }

    .island-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 10px 18px;
    }

    .chain-heading {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      padding: 12px 6px 5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chain-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }

    .island-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-main);
      padding: 7px 9px;
      border-radius: 7px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 2px;
      transition: background 0.12s ease, border-color 0.12s ease;
    }

    .island-btn:hover {
      background: var(--item-hover);
    }

    .island-btn.active {
      background: var(--item-active);
      border-color: rgba(66, 217, 200, 0.6);
    }

    .island-btn-main {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .island-btn-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .island-btn-sub {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .island-tag {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--accent-gold);
      flex-shrink: 0;
    }

    .island-tag.secret {
      color: var(--accent-coral);
      background: rgba(240, 140, 107, 0.14);
      border: 1px solid rgba(240, 140, 107, 0.32);
    }

    /* Main Map Stage */
    .stage-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #061423;
    }

    #map-viewport {
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }

    #map-viewport.dragging {
      cursor: grabbing;
    }

    /* Crisp Projected HTML Labels Overlay */
    .labels-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 6;
    }

    .labels-layer.hidden {
      display: none;
    }

    .chain-banner {
      position: absolute;
      transform: translate(-50%, -50%);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(230, 184, 114, 0.72);
      text-shadow: 0 1px 6px rgba(3, 10, 18, 0.95);
      white-space: nowrap;
      pointer-events: none;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(7, 17, 29, 0.42);
      border: 1px solid rgba(230, 184, 114, 0.18);
    }

    .map-label {
      position: absolute;
      transform: translate(-50%, -100%);
      pointer-events: auto;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      transition: transform 0.12s ease;
    }

    .map-label:hover {
      transform: translate(-50%, -100%) scale(1.06);
      z-index: 12;
    }

    .map-label-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(8, 18, 30, 0.84);
      border: 1px solid rgba(230, 184, 114, 0.36);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.48);
      font-size: 12px;
      font-weight: 650;
      color: var(--text-main);
      white-space: nowrap;
      backdrop-filter: blur(4px);
    }

    .map-label.selected .map-label-pill {
      background: rgba(16, 46, 56, 0.94);
      border-color: var(--accent-teal);
      color: #e9fffc;
      box-shadow: 0 0 14px rgba(66, 217, 200, 0.38);
    }

    .map-label.secret .map-label-pill {
      border-color: rgba(240, 140, 107, 0.58);
      color: #ffe7de;
    }

    .map-label-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .map-label-sub {
      font-size: 10px;
      font-weight: 500;
      color: rgba(226, 236, 245, 0.86);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.95);
      white-space: nowrap;
      display: none;
    }

    .map-label.show-sub .map-label-sub,
    .map-label.selected .map-label-sub {
      display: block;
    }

    .map-label-stem {
      width: 1.5px;
      height: 8px;
      background: linear-gradient(to bottom, rgba(230, 184, 114, 0.78), rgba(230, 184, 114, 0.05));
    }

    /* Top-Left Selected Island Inspector Card */
    .inspector-card {
      position: absolute;
      top: 14px;
      left: 14px;
      width: 345px;
      max-width: calc(100% - 340px);
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 11px;
      padding: 12px 14px;
      backdrop-filter: blur(9px);
      z-index: 15;
      display: flex;
      flex-direction: column;
      gap: 7px;
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.42);
    }

    .inspector-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .inspector-title {
      font-size: 16.5px;
      font-weight: 700;
      color: var(--accent-gold);
      line-height: 1.2;
    }

    .inspector-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: var(--text-main);
      font-size: 11px;
      padding: 3px 7px;
      border-radius: 6px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .cue-badge {
      font-size: 10.5px;
      padding: 2px 7px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.11);
      color: var(--text-main);
    }

    .cue-badge.highlight {
      border-color: rgba(66, 217, 200, 0.42);
      color: #cbfaf4;
      background: rgba(66, 217, 200, 0.1);
    }

    .inspector-meta {
      font-size: 12px;
      line-height: 1.42;
      color: var(--text-main);
    }

    .inspector-routes {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 2px;
    }

    .inspector-routes-label {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .route-chip-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .route-chip {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(230, 184, 114, 0.11);
      border: 1px solid rgba(230, 184, 114, 0.3);
      color: #f9e8c8;
      cursor: pointer;
    }

    .route-chip:hover {
      background: rgba(230, 184, 114, 0.24);
    }

    /* Top-Right Toolbar Card */
    .toolbar-card {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 320px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 11px;
      padding: 10px 12px;
      backdrop-filter: blur(9px);
      z-index: 15;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.42);
    }

    .toolbar-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
    }

    .toolbar-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      min-width: 56px;
    }

    .tool-btn {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-main);
      font-size: 11.5px;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease;
    }

    .tool-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .tool-btn.active {
      background: rgba(66, 217, 200, 0.22);
      border-color: var(--accent-teal);
      color: #dffcf8;
    }

    .range-slider {
      flex: 1;
      accent-color: var(--accent-gold);
      cursor: pointer;
      min-width: 90px;
    }

    .slider-val {
      font-size: 11px;
      color: var(--accent-gold);
      font-variant-numeric: tabular-nums;
      min-width: 34px;
      text-align: right;
    }

    /* Bottom-Left Hint Bar */
    .hint-bar {
      position: absolute;
      bottom: 14px;
      left: 14px;
      background: rgba(8, 16, 26, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: 8px;
      padding: 6px 11px;
      font-size: 11.5px;
      color: var(--text-muted);
      pointer-events: none;
      z-index: 14;
    }

    /* Bottom-Right Scale & Legend Bar */
    .scale-card {
      position: absolute;
      bottom: 14px;
      right: 14px;
      background: rgba(8, 16, 26, 0.86);
      border: 1px solid rgba(230, 184, 114, 0.24);
      border-radius: 9px;
      padding: 8px 12px;
      z-index: 14;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 205px;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 10.5px;
      color: var(--text-muted);
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .scale-bar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .scale-bar-graphic {
      height: 6px;
      width: 96px;
      border-left: 2px solid var(--accent-gold);
      border-right: 2px solid var(--accent-gold);
      border-bottom: 2px solid var(--accent-gold);
      transition: width 0.06s linear;
    }

    .scale-bar-text {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent-gold);
      white-space: nowrap;
    }

    @media (max-width: 900px) {
      .map-layout {
        grid-template-columns: 245px 1fr;
      }
      .inspector-card {
        width: 270px;
        max-width: calc(100% - 28px);
      }
      .toolbar-card {
        width: 275px;
      }
      .hint-bar {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="map-layout" class="map-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-topline">
          <span class="sidebar-title">Known Ocean Map</span>
          <div class="nav-links">
            <a class="nav-link" href="./asset-viewer.html">Assets</a>
            <a class="nav-link" href="./index.html">← Game</a>
          </div>
        </div>
        <div id="region-pills" class="region-pills">
          <button class="region-pill active" data-region="all">All Ocean</button>
          <button class="region-pill" data-region="act1_raiatea">Ra'iatea Chain</button>
          <button class="region-pill" data-region="act2_nuku_hiva">Nuku Hiva Chain</button>
          <button class="region-pill" data-region="act3_mist_isles">Hawai'i Chain</button>
          <button class="region-pill" data-region="rapa_nui">Rapa Nui</button>
        </div>
        <input
          id="island-search"
          class="search-input"
          type="search"
          placeholder="Search islands, elders, lagoons..."
          autocomplete="off"
        />
      </div>
      <div id="island-list" class="island-list"></div>
    </aside>

    <main class="stage-wrap">
      <div id="map-viewport"></div>
      <div id="map-labels" class="labels-layer"></div>

      <section id="inspector-card" class="inspector-card"></section>

      <section class="toolbar-card">
        <div class="toolbar-row">
          <span class="toolbar-label">View:</span>
          <button id="btn-view-top" class="tool-btn active">Top View</button>
          <button id="btn-view-tilt" class="tool-btn">Relief Tilt</button>
          <button id="btn-fit-ocean" class="tool-btn">Fit Ocean</button>
          <button id="btn-toggle-sidebar" class="tool-btn" title="Toggle Island List">List</button>
        </div>

        <div class="toolbar-row">
          <span class="toolbar-label">Zoom:</span>
          <button id="btn-zoom-out" class="tool-btn" title="Zoom Out">−</button>
          <input id="zoom-slider" class="range-slider" type="range" min="0" max="100" value="18" />
          <button id="btn-zoom-in" class="tool-btn" title="Zoom In">+</button>
        </div>

        <div class="toolbar-row">
          <span class="toolbar-label">Islands:</span>
          <input id="scale-slider" class="range-slider" type="range" min="80" max="210" value="140" />
          <span id="scale-val" class="slider-val">1.4×</span>
        </div>

        <div class="toolbar-row">
          <span class="toolbar-label">Light:</span>
          <button class="tool-btn" data-light="morning">Dawn</button>
          <button class="tool-btn active" data-light="midday">Sun</button>
          <button class="tool-btn" data-light="dusk">Dusk</button>
          <button class="tool-btn" data-light="night">Night</button>
        </div>

        <div class="toolbar-row">
          <span class="toolbar-label">Layers:</span>
          <button id="toggle-labels" class="tool-btn active">Labels</button>
          <button id="toggle-routes" class="tool-btn active">Star Paths</button>
          <button id="toggle-clouds" class="tool-btn">Clouds</button>
          <button id="toggle-rings" class="tool-btn">Cue Rings</button>
        </div>
      </section>

      <div class="hint-bar">
        Drag: Pan across ocean · Scroll / Pinch: Zoom at cursor · Click island: Inspect · Double-click: Zoom in · F: Fit Ocean
      </div>

      <div class="scale-card">
        <div class="legend-row">
          <span class="legend-item"><span class="chain-dot" style="background:#f0c26b"></span>Act I</span>
          <span class="legend-item"><span class="chain-dot" style="background:#42d9c8"></span>Act II</span>
          <span class="legend-item"><span class="chain-dot" style="background:#9eb8ff"></span>Act III</span>
          <span class="legend-item"><span class="chain-dot" style="background:#f08c6b"></span>Secret</span>
        </div>
        <div class="scale-bar-row">
          <div id="scale-bar-graphic" class="scale-bar-graphic"></div>
          <span id="scale-bar-text" class="scale-bar-text">5 Sailing Units</span>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="./src/oceanMap.js"></script>
</body>
</html>
