<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kavenga — 3D Asset Debug Viewer</title>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js"
      }
    }
  </script>
  <style>
    :root {
      --bg-deep: #0b131d;
      --panel-bg: rgba(14, 24, 36, 0.92);
      --panel-border: rgba(217, 179, 120, 0.24);
      --accent-gold: #e6b872;
      --accent-teal: #42d9c8;
      --text-main: #f2ece1;
      --text-muted: #9fb0c2;
      --item-hover: rgba(230, 184, 114, 0.12);
      --item-active: rgba(230, 184, 114, 0.24);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-deep);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    .viewer-layout {
      display: grid;
      grid-template-columns: 310px 1fr;
      width: 100%;
      height: 100%;
    }

    /* Sidebar Asset Catalog */
    .sidebar {
      background: rgba(10, 18, 28, 0.98);
      border-right: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      z-index: 10;
    }

    .sidebar-header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .sidebar-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .sidebar-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: var(--accent-gold);
    }

    .back-link {
      font-size: 12px;
      color: var(--accent-teal);
      text-decoration: none;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid rgba(66, 217, 200, 0.32);
      background: rgba(66, 217, 200, 0.08);
    }

    .back-link:hover {
      background: rgba(66, 217, 200, 0.18);
    }

    .search-input {
      width: 100%;
      padding: 7px 10px;
      border-radius: 7px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      font-size: 13px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent-gold);
    }

    .asset-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px 18px;
    }

    .category-heading {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      padding: 12px 6px 5px;
    }

    .asset-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-main);
      padding: 7px 9px;
      border-radius: 7px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 2px;
      transition: background 0.12s ease, border-color 0.12s ease;
    }

    .asset-btn:hover {
      background: var(--item-hover);
    }

    .asset-btn.active {
      background: var(--item-active);
      border-color: rgba(230, 184, 114, 0.55);
    }

    .asset-btn-main {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .asset-btn-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .asset-btn-sub {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .asset-tag {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--accent-gold);
      flex-shrink: 0;
    }

    /* 3D Viewport Stage */
    .stage-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 42%, #192b3f 0%, #0b131d 75%);
    }

    #viewport {
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    #viewport:active {
      cursor: grabbing;
    }

    /* Floating Info Card (Top-Left) */
    .info-card {
      position: absolute;
      top: 14px;
      left: 14px;
      max-width: 410px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 12px 14px;
      backdrop-filter: blur(8px);
      pointer-events: none;
    }

    .info-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--accent-gold);
      margin-bottom: 3px;
    }

    .info-desc {
      font-size: 12.5px;
      line-height: 1.4;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .stats-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .stat-pill {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2px 7px;
      border-radius: 5px;
    }

    /* Camera & Debug Toolbar (Top-Right) */
    .toolbar-card {
      position: absolute;
      top: 14px;
      right: 14px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 10px 12px;
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 300px;
    }

    .toolbar-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
    }

    .toolbar-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-right: 4px;
    }

    .tool-btn {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-main);
      font-size: 11.5px;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
    }

    .tool-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .tool-btn.active {
      background: rgba(66, 217, 200, 0.22);
      border-color: var(--accent-teal);
      color: #dffcf8;
    }

    .zoom-slider {
      flex: 1;
      accent-color: var(--accent-gold);
      cursor: pointer;
    }

    /* Asset-Specific Inspector Controls (Bottom-Right) */
    .context-card {
      position: absolute;
      bottom: 14px;
      right: 14px;
      width: 340px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 12px 14px;
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .context-card.hidden {
      display: none;
    }

    .context-heading {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent-teal);
    }

    .ctrl-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
    }

    .ctrl-row input[type="range"] {
      width: 155px;
      accent-color: var(--accent-gold);
    }

    .ctrl-checks {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 12px;
    }

    .ctrl-checks label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    /* Controls Hint Bar (Bottom-Left) */
    .hint-bar {
      position: absolute;
      bottom: 14px;
      left: 14px;
      background: rgba(10, 18, 28, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 6px 11px;
      font-size: 11.5px;
      color: var(--text-muted);
      pointer-events: none;
    }

    @media (max-width: 860px) {
      .viewer-layout {
        grid-template-columns: 240px 1fr;
      }
      .info-card {
        max-width: 280px;
      }
    }
  </style>
</head>
<body>
  <div class="viewer-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-topline">
          <span class="sidebar-title">Kavenga 3D Assets</span>
          <a class="back-link" href="./index.html">← Game</a>
        </div>
        <input
          id="asset-search"
          class="search-input"
          type="search"
          placeholder="Filter canoe, birds, islands, fish..."
          autocomplete="off"
        />
      </div>
      <div id="asset-list" class="asset-list"></div>
    </aside>

    <main class="stage-wrap">
      <div id="viewport"></div>

      <section class="info-card">
        <div id="info-title" class="info-title">Loading...</div>
        <div id="info-desc" class="info-desc"></div>
        <div id="info-stats" class="stats-row"></div>
      </section>

      <section class="toolbar-card">
        <div class="toolbar-row">
          <span class="toolbar-label">Camera:</span>
          <button class="tool-btn" data-cam="iso">3/4</button>
          <button class="tool-btn" data-cam="front">Front</button>
          <button class="tool-btn" data-cam="side">Side</button>
          <button class="tool-btn" data-cam="back">Rear</button>
          <button class="tool-btn" data-cam="top">Top</button>
          <button class="tool-btn" data-cam="bottom">Under</button>
          <button class="tool-btn" data-cam="reset">Reset</button>
        </div>
        <div class="toolbar-row">
          <span class="toolbar-label">Zoom:</span>
          <button id="btn-zoom-in" class="tool-btn" title="Zoom In">+</button>
          <input id="zoom-slider" class="zoom-slider" type="range" min="0" max="100" value="45" />
          <button id="btn-zoom-out" class="tool-btn" title="Zoom Out">−</button>
        </div>
        <div class="toolbar-row">
          <button id="toggle-water" class="tool-btn active">Water &amp; Grid</button>
          <button id="toggle-edges" class="tool-btn">Edges</button>
          <button id="toggle-wire" class="tool-btn">Wireframe</button>
          <button id="toggle-axes" class="tool-btn">Axes</button>
          <button id="toggle-spin" class="tool-btn">Auto-Spin</button>
          <button id="toggle-pause" class="tool-btn">Pause</button>
        </div>
      </section>

      <section id="context-card" class="context-card hidden"></section>

      <div class="hint-bar">
        Left-drag: Rotate 360° · Scroll / Pinch / Slider: Zoom · Right-drag or Shift+drag: Pan · Double-click: Reset View
      </div>
    </main>
  </div>

  <script type="module" src="./src/assetViewer.js"></script>
</body>
</html>
