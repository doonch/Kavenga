  <style>

      transform: translate3d(0, 0, 0) scale(1);
    }

    .intro-banner-img {

    .intro-start-btn {

<body>
  <div id="intro-webgl"></div>

  <audio id="intro-theme-audio" src="./assets/audio/tide.mp3" preload="auto" loop playsinline></audio>
  <a id="btn-intro-skip" href="./index.html" class="intro-skip-pill" title="Skip Intro to Game">Skip →</a>
  <button id="btn-intro-audio" class="intro-audio-btn" type="button" title="Toggle Theme Audio" aria-label="Toggle Theme Audio">🔊</button>

  <div class="intro-overlay">
    <div class="intro-title-stack">
      <div id="intro-banner" class="intro-banner-wrap">
        <img
          src="./assets/banner.png"
          alt="Kavenga"
          class="intro-banner-img"
        />
      </div>

        Songs of the Star Path
      </div>
    </div>

    <div id="intro-start-wrap" class="intro-start-wrap">
      <a id="btn-intro-start" href="./index.html" class="intro-start-btn">Start</a>
    </div>
  </div>

  <script>
    (() => {
      const audio = document.getElementById('intro-theme-audio');
      const btn = document.getElementById('btn-intro-audio');
      if (!audio || !btn) return;

      const isMainGameAudioOff = () => {
        try {
          if (localStorage.getItem('kavenga_audio_muted_v1') === '1') return true;
          if (localStorage.getItem('kavenga_music_enabled_v1') === 'false') return true;
        } catch {
          // Ignore storage errors
        }
        return false;
      };

      let userMuted = isMainGameAudioOff();

      const syncBtn = () => {
        const isAudible = !audio.paused && !audio.muted && !userMuted;
        btn.textContent = isAudible ? '🔊' : '🔇';
        btn.title = isAudible ? 'Theme Audio On — Click to Mute' : 'Theme Audio Off — Click to Play';
        btn.setAttribute('aria-pressed', String(isAudible));
      };

      const tryPlay = () => {
        if (userMuted) return;
        audio.muted = false;
        audio.volume = 0.72;
        const p = audio.play();
        if (p && typeof p.then === 'function') {
          p.then(syncBtn).catch(() => {
            syncBtn();
          });
        } else {
          syncBtn();
        }
      };

      // Unlock playback on first user interaction if browser blocks unmuted autoplay
      const unlockOnGesture = (e) => {
        if (e.target === btn) return;
        if (!userMuted && audio.paused) {
          tryPlay();
        }
        if (!audio.paused) {
          window.removeEventListener('pointerdown', unlockOnGesture, true);
          window.removeEventListener('keydown', unlockOnGesture, true);
          window.removeEventListener('touchstart', unlockOnGesture, true);
        }
      };
      window.addEventListener('pointerdown', unlockOnGesture, true);
      window.addEventListener('keydown', unlockOnGesture, true);
      window.addEventListener('touchstart', unlockOnGesture, true);

      btn.addEventListener('click', (e) => {
        e.currentTarget.blur();
        if (audio.paused || audio.muted || userMuted) {
          userMuted = false;
          tryPlay();
        } else {
          userMuted = true;
          audio.pause();
          syncBtn();
        }
      });

      audio.addEventListener('play', syncBtn);
      audio.addEventListener('pause', syncBtn);
      syncBtn();
      tryPlay();
    })();
  </script>
  <script type="module" src="./src/intro.js?v=20261120m"></script>
